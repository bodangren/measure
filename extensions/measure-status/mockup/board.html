html { font-size: 14px; line-height: 1.45; -webkit-text-size-adjust: 100%; }

button { font: inherit; color: inherit; }

.repo-name { font-weight: 650; overflow-wrap: anywhere; }
.chev { display: inline-block; width: 1em; color: var(--oc-muted); transition: transform 120ms; }

.count b { font-family: var(--oc-mono); font-weight: 600; color: var(--oc-fg); }
.count[data-zero="true"] b { color: var(--oc-subtle); }

.board { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 12px; padding: 4px 12px 12px; }
.column { flex: 1 1 220px; min-width: 220px; max-width: 320px; border: 1px solid var(--oc-border); border-radius: var(--oc-radius); background: var(--oc-muted-surface); padding: 8px; }

.col-toggle[aria-expanded="true"] { margin-bottom: 8px; }
.col-toggle[aria-expanded="true"] .chev { transform: rotate(90deg); }
.cards { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }

.card-foot { margin-top: 6px; font-size: 0.8rem; color: var(--oc-subtle); }

  .repo-id, .counts { flex-basis: 100%; }

:null,"line":null,"lastChange":null,"doneDate":"2026-11-15","doneSource":"folder"},{"repo":"measure","title":"Ox thimble to an","registered":true,"column":"done","position":null,"marker":null,"taskText":null,"note":null,"line":null,"lastChange":null,"doneDate":"2026-11-15","doneSource":"folder"},{"repo":"measure","title":"To rampart ox","registered":true,"column":"done","position":null,"marker":null,"taskText":null,"note":null,"line":null,"lastChange":null,"doneDate":"2026-11-15","doneSource":"folder"},{"repo":"measure","title":"Cairn inlet of to","registered":true,"column":"done","position":null,"marker":null,"taskText":null,"note":null,"line":null,"lastChange":null,"doneDate":"2026-11-17","doneSource":"folder"},{"repo":"measure","title":"Wren oyster an lumen outpost plum to of","registered":false,"column":"done","position":null,"marker":null,"taskText":null,"note":null,"line":null,"lastChange":null,"doneDate":"2026-05-27","doneSource":"folder"},{"repo":"measure","title":"Urn mooring jasmine an sparrow iris","registered":false,"column":"done","position":null,"marker":null,"taskText":null,"note":null,"line":null,"lastChange":null,"doneDate":"2026-05-27","doneSource":"folder"},{"repo":"measure","title":"Tern an to of to gull flagon tidal to","registered":false,"column":"done","position":null,"marker":null,"taskText":null,"note":null,"line":null,"lastChange":null,"doneDate":"2026-05-27","doneSource":"folder"},{"repo":"measure","title":"Keel lark urn an elm reed ox an","registered":false,"column":"done","position":null,"marker":null,"taskText":null,"note":null,"line":null,"lastChange":null,"doneDate":"2026-05-27","doneSource":"folder"}]}]}</script>
<script>
(function () {
  'use strict';
  var COLUMNS = ['planned', 'in-progress', 'blocked', 'waiting', 'done'];
  var LABELS = { planned: 'Planned', 'in-progress': 'In progress', blocked: 'Blocked', waiting: 'Waiting on Daniel', done: 'Done' };
  var CAP = 8;
  var DONE_SHOWN = 5;
  var AGE_TIP = 'Time of the last change to plan.md or metadata.json (file time, not a commit time).';
  var data = JSON.parse(document.getElementById('fixture').textContent);
  var query = new URLSearchParams(window.location.search);
  var theme = query.get('theme') === 'dark' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-oc-theme', theme);
  var now = data.capturedAt;
  var app = document.getElementById('app');

  function el(tag, attrs, kids) {
    var node = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (attrs[k] !== null && attrs[k] !== undefined) node.setAttribute(k, String(attrs[k]));
    });
    (kids || []).forEach(function (kid) {
      node.appendChild(typeof kid === 'string' ? document.createTextNode(kid) : kid);
    });
    if (node.hasAttribute('data-action')) node.addEventListener('click', onAction);
    return node;
  }
  function formatAge(from, then) {
    var ms = from - then;
    if (ms < 60000) return '<1m';
    var min = Math.floor(ms / 60000);
    if (min < 60) return min + 'm';
    var hours = Math.floor(min / 60);
    if (hours < 24) return hours + 'h';
    var days = Math.floor(hours / 24);
    if (days < 60) return days + 'd';
    return Math.floor(days / 30) + 'mo';
  }
  function tally(repo) {
    var out = {};
    COLUMNS.forEach(function (c) { out[c] = 0; });
    repo.cards.forEach(function (card) { out[card.column] += 1; });
    return out;
  }
  function sorted(cards, column) {
    var rows = cards.map(function (card, i) { return { card: card, i: i }; });
    rows.sort(function (a, b) {
      var x = column === 'done' ? a.card.doneDate : a.card.lastChange;
      var y = column === 'done' ? b.card.doneDate : b.card.lastChange;
      if (x === null && y === null) return a.i - b.i;
      if (x === null) return 1;
      if (y === null) return -1;
      if (x === y) return a.i - b.i;
      return x < y ? 1 : -1;
    });
    return rows.map(function (r) { return r.card; });
  }

  var state = { open: {}, doneOpen: {}, expanded: {} };
  data.repos.forEach(function (repo) {
    var n = tally(repo);
    state.open[repo.repo] = n.blocked > 0 || n.waiting > 0 || query.get('open') === repo.repo;
    state.doneOpen[repo.repo] = query.get('done') === 'open';
  });

  function renderCard(card) {
    var tone = card.column === 'blocked' || card.column === 'waiting' ? card.column : 'none';
    var kids = [el('div', { class: 'card-title', title: card.title }, [card.title])];
    if (card.column !== 'done') {
      if (card.position) {
        kids.push(el('div', { class: 'card-pos' }, ['Phase ' + card.position.phase + '/' + card.position.phases + ' \u00b7 Task ' + card.position.task + '/' + card.position.tasks]));
        kids.push(el('div', { class: 'card-task', title: card.taskText }, [el('span', { class: 'marker' }, ['[' + card.marker + ']']), ' ' + card.taskText]));
      } else if (card.note) {
        kids.push(el('div', { class: 'card-note' }, [card.note]));
      }
      if (card.line) {
        kids.push(el('div', { class: 'card-line' }, [el('span', { class: 'line-label' }, [card.column === 'blocked' ? 'Blocker' : 'Gate']), card.line]));
      }
    }
    if (!card.registered) kids.push(el('div', { class: 'card-flag' }, ['Not in the registry']));
    if (card.column === 'done') {
      var foot = card.doneDate === null ? 'No date' : (card.doneSource === 'folder' ? 'From ' : 'Done ') + card.doneDate;
      kids.push(el('div', { class: 'card-foot' }, [foot]));
    } else {
      kids.push(el('div', { class: 'card-foot', title: AGE_TIP }, [card.lastChange === null ? 'Updated unknown' : 'Updated ' + formatAge(now, card.lastChange)]));
    }
    return el('li', { class: 'card', 'data-card': '', 'data-tone': tone }, kids);
  }

  function renderColumn(repo, column, total) {
    var cards = sorted(repo.cards.filter(function (c) { return c.column === column; }), column);
    var kids = [];
    var label = LABELS[column];
    if (column === 'done') {
      var isOpen = state.doneOpen[repo.repo] === true;
      kids.push(el('button', { type: 'button', class: 'col-toggle', 'data-action': 'toggle-done', 'data-repo': repo.repo, 'aria-expanded': isOpen ? 'true' : 'false' }, [
        el('span', { class: 'col-name' }, [el('span', { class: 'chev', 'aria-hidden': 'true' }, ['\u25b8']), label]),
        el('span', { class: 'col-count' }, [String(total)])
      ]));
      if (isOpen) {
        if (cards.length === 0) kids.push(el('p', { class: 'empty' }, ['None']));
        else kids.push(el('ul', { class: 'cards' }, cards.slice(0, DONE_SHOWN).map(renderCard)));
        if (cards.length > DONE_SHOWN) kids.push(el('p', { class: 'col-note' }, ['Showing the ' + DONE_SHOWN + ' most recent of ' + total]));
      }
    } else {
      kids.push(el('div', { class: 'col-head' }, [el('span', { class: 'col-name' }, [label]), el('span', { class: 'col-count' }, [String(total)])]));
      var expanded = state.expanded[repo.repo + '/' + column] === true;
      var shown = expanded ? cards : cards.slice(0, CAP);
      if (cards.length === 0) kids.push(el('p', { class: 'empty' }, ['None']));
      else kids.push(el('ul', { class: 'cards' }, shown.map(renderCard)));
      if (cards.length > shown.length) {
        kids.push(el('button', { type: 'button', class: 'more', 'data-action': 'show-more', 'data-repo': repo.repo, 'data-column': column }, ['Show ' + (cards.length - shown.length) + ' more']));
      }
    }
    return el('div', { class: 'column', 'data-column': column }, kids);
  }

  function renderSection(repo, index) {
    var n = tally(repo);
    var isOpen = state.open[repo.repo] === true;
    var chips = COLUMNS.map(function (c) {
      if ((c === 'blocked' || c === 'waiting') && n[c] > 0) return el('span', { class: 'badge', 'data-tone': c }, [n[c] + ' ' + LABELS[c]]);
      return el('span', { class: 'count', 'data-zero': n[c] === 0 ? 'true' : 'false' }, [el('b', {}, [String(n[c])]), ' ' + LABELS[c]]);
    });
    var toggle = el('button', { type: 'button', class: 'repo-toggle', 'data-action': 'toggle-section', 'data-repo': repo.repo, 'aria-expanded': isOpen ? 'true' : 'false', 'aria-controls': 'board-' + index }, [
      el('span', { class: 'repo-id' }, [el('span', { class: 'chev', 'aria-hidden': 'true' }, ['\u25b8']), el('span', { class: 'repo-name' }, [repo.repo])]),
      el('span', { class: 'counts' }, chips)
    ]);
    var board = el('div', { class: 'board', id: 'board-' + index }, COLUMNS.map(function (c) { return renderColumn(repo, c, n[c]); }));
    if (!isOpen) board.setAttribute('hidden', '');
    return el('section', { class: 'repo', 'data-repo': repo.repo }, [el('h2', { class: 'repo-head' }, [toggle]), board]);
  }

  function renderSummary() {
    var blocked = 0;
    var waiting = 0;
    data.repos.forEach(function (repo) {
      var n = tally(repo);
      blocked += n.blocked;
      waiting += n.waiting;
    });
    var summary = document.getElementById('summary');
    summary.textContent = '';
    if (blocked > 0) summary.appendChild(el('span', { class: 'badge', 'data-tone': 'blocked' }, [blocked + ' Blocked']));
    if (waiting > 0) summary.appendChild(el('span', { class: 'badge', 'data-tone': 'waiting' }, [waiting + ' Waiting on Daniel']));
    document.getElementById('meta').textContent = 'Static mockup. ' + data.repos.length + ' repos. Data captured ' + new Date(data.capturedAt).toISOString().slice(0, 16).replace('T', ' ') + ' UTC. No file is read.';
  }

  function render(focusKey) {
    app.textContent = '';
    data.repos.forEach(function (repo, i) { app.appendChild(renderSection(repo, i)); });
    renderSummary();
    if (focusKey) {
      var target = app.querySelector(focusKey);
      if (target) target.focus();
    }
  }

  function selectorOf(button) {
    var s = 'button[data-action="' + button.getAttribute('data-action') + '"]';
    if (button.hasAttribute('data-repo')) s += '[data-repo="' + button.getAttribute('data-repo').replace(/["\\]/g, '') + '"]';
    if (button.hasAttribute('data-column')) s += '[data-column="' + button.getAttribute('data-column') + '"]';
    return s;
  }

  function onAction(event) {
    var button = event.currentTarget;
    var action = button.getAttribute('data-action');
    var repo = button.getAttribute('data-repo');
    var column = button.getAttribute('data-column');
    if (action === 'toggle-section') state.open[repo] = !state.open[repo];
    else if (action === 'toggle-done') state.doneOpen[repo] = !state.doneOpen[repo];
    else if (action === 'show-more') state.expanded[repo + '/' + column] = true;
    render(action === 'show-more' || action === 'refresh' ? null : selectorOf(button));
  }
  document.querySelector('button[data-action="refresh"]').addEventListener('click', onAction);

  render(null);
  if (query.get('debug') === '1') {
    document.getElementById('debug').textContent = 'scrollWidth=' + document.documentElement.scrollWidth + ' innerWidth=' + window.innerWidth;
  }
})();
</script>
